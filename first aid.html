<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Первая помощь — Билеты</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            display: flex;
            gap: 24px;
            max-width: 1300px;
            width: 100%;
            align-items: flex-start;
        }
        .container {
            flex: 1;
            min-width: 0;
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        .nav-panel {
            flex-shrink: 0;
            width: 240px;
            background: white;
            padding: 18px 16px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .nav-panel h3 {
            font-size: 15px;
            margin: 0 0 12px 0;
            color: #1a2a3a;
            text-align: center;
            border-bottom: 1px solid #e6edf5;
            padding-bottom: 10px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .nav-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            background: #eef4fa;
            color: #1a2a3a;
            transition: 0.15s;
            border: 2px solid transparent;
            user-select: none;
        }
        .nav-cell:hover {
            background: #d0ddea;
            transform: scale(1.05);
        }
        .nav-cell.correct {
            background: #1e9b4c;
            color: white;
            border-color: #1a7a3a;
        }
        .nav-cell.wrong {
            background: #d43f34;
            color: white;
            border-color: #b33a2e;
        }
        .nav-cell.current {
            border-color: #1a6bc4;
            box-shadow: 0 0 0 2px #1a6bc4;
        }
        .nav-cell.unanswered {
            background: #eef4fa;
            color: #4a6a8a;
        }
        .nav-stats {
            margin-top: 12px;
            font-size: 13px;
            color: #2a4a6a;
            text-align: center;
            border-top: 1px solid #e6edf5;
            padding-top: 10px;
        }
        .nav-stats span {
            font-weight: 700;
        }
        .nav-stats .green { color: #1a7a3a; }
        .nav-stats .red { color: #b33a2e; }

        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #1a2a3a;
            border-bottom: 2px solid #e6edf5;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 16px;
            font-weight: normal;
            color: #4a6a8a;
        }
        .progress {
            background: #e6edf5;
            border-radius: 30px;
            height: 8px;
            margin: 10px 0 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #2a7de1;
            border-radius: 30px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .question-block {
            background: #f9fcff;
            border-radius: 14px;
            padding: 18px 20px 10px;
            margin-bottom: 20px;
            border: 1px solid #e2ebf5;
            transition: 0.2s;
        }
        .question-block.correct {
            border-left: 6px solid #1e9b4c;
            background: #f0faf4;
        }
        .question-block.wrong {
            border-left: 6px solid #d43f34;
            background: #fdf2f0;
        }
        .question-text {
            font-weight: 600;
            font-size: 16px;
            color: #0b1e2e;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .question-text .q-label {
            background: #1a6bc4;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-right: 8px;
            display: inline-block;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 4px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: white;
            border: 1px solid #dce6f0;
            cursor: pointer;
            transition: 0.15s;
            font-size: 15px;
            line-height: 1.4;
        }
        .option:hover {
            background: #eef4fa;
            border-color: #b0c8df;
        }
        .option input[type="radio"] {
            margin-top: 4px;
            flex-shrink: 0;
            accent-color: #1a6bc4;
            width: 17px;
            height: 17px;
            cursor: pointer;
        }
        .option.selected-correct {
            background: #d4edda;
            border-color: #1e9b4c;
        }
        .option.selected-wrong {
            background: #f8ddda;
            border-color: #d43f34;
        }
        .option.show-correct {
            background: #d4edda;
            border-color: #1e9b4c;
        }
        .option.disabled {
            cursor: default;
            opacity: 0.9;
        }
        .option.disabled:hover {
            background: white;
        }
        .option.disabled.selected-correct:hover {
            background: #d4edda;
        }
        .option.disabled.selected-wrong:hover {
            background: #f8ddda;
        }
        .option.disabled.show-correct:hover {
            background: #d4edda;
        }
        .result-badge {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .result-badge .correct-text {
            color: #1a7a3a;
        }
        .result-badge .wrong-text {
            color: #b33a2e;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2ebf5;
        }
        .pagination .info {
            font-size: 15px;
            color: #2a4a6a;
        }
        .btn {
            background: #e6edf5;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            color: #1a2a3a;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover {
            background: #d0ddea;
        }
        .btn-primary {
            background: #1a6bc4;
            color: white;
        }
        .btn-primary:hover {
            background: #0f5aad;
        }
        .btn-secondary {
            background: #e6edf5;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn:disabled:hover {
            background: #e6edf5;
        }
        .restart-btn {
            background: #d43f34;
            color: white;
        }
        .restart-btn:hover {
            background: #b83228;
        }
        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #6a8aaa;
        }
        .summary {
            background: #f0f4fa;
            border-radius: 16px;
            padding: 20px 24px;
            margin-top: 10px;
            border: 2px solid #d0ddea;
        }
        .summary h3 {
            margin-top: 0;
            color: #1a2a3a;
        }
        .summary-item {
            padding: 6px 0;
            border-bottom: 1px solid #dce6f0;
            font-size: 14px;
            line-height: 1.5;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
        .summary-item .s-correct { color: #1a7a3a; font-weight: 600; }
        .summary-item .s-wrong { color: #b33a2e; font-weight: 600; }
        .summary-stats {
            font-size: 18px;
            font-weight: 700;
            padding: 12px 0 8px;
        }
        .hide-summary-btn {
            margin-top: 12px;
        }
        .ticket-badge {
            display: inline-block;
            background: #2a7de1;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        /* Анимация прокрутки */
        .scroll-anchor {
            scroll-margin-top: 20px;
        }

        @media (max-width: 960px) {
            .wrapper {
                flex-direction: column;
            }
            .nav-panel {
                width: 100%;
                position: static;
                max-height: none;
                order: -1;
            }
            .nav-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
        @media (max-width: 600px) {
            .container { padding: 16px; }
            .question-text { font-size: 15px; }
            .option { font-size: 14px; padding: 6px 10px; }
            .pagination { flex-direction: column; align-items: stretch; }
            .pagination .info { text-align: center; }
            .btn { padding: 10px 16px; font-size: 14px; }
            .nav-panel { padding: 12px; }
            .nav-grid { gap: 3px; }
            .nav-cell { font-size: 10px; }
        }
    </style>
</head>

<div class="wrapper">
    <div class="container" id="app">
        <h1>

        </div>

    // --------------------------------------------------------------
    // Перемешивание и состояние
    // --------------------------------------------------------------
    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    let allQuestions = [];
    let currentPage = 0;
    const PER_PAGE = 5;
    let answers = {};
    let testCompleted = false;

    // Функция прокрутки вверх
    function scrollToTop() {
        const anchor = document.getElementById('topAnchor');
        if (anchor) {
            anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function init() {
        const shuffled = shuffleArray(RAW_QUESTIONS);
        allQuestions = shuffled.map(q => ({
            ...q,
            options: shuffleArray(q.options)
        }));
        currentPage = 0;
        answers = {};
        testCompleted = false;
        document.getElementById('summaryContainer').innerHTML = '';
        render();
        renderNav();
        scrollToTop();
    }

    function renderNav() {
        const grid = document.getElementById('navGrid');
        let html = '';
        allQuestions.forEach((q, idx) => {
            const userAnswer = answers[q.id];
            let cls = 'nav-cell unanswered';
            if (userAnswer) {
                cls = userAnswer === q.correctAnswer ? 'nav-cell correct' : 'nav-cell wrong';
            }
            const start = currentPage * PER_PAGE;
            if (idx >= start && idx < start + PER_PAGE) {
                cls += ' current';
            }
            html += `<div class="${cls}" onclick="goToQuestion(${idx})" title="Билет ${q.ticket}, вопрос ${q.id}">${q.id}</div>`;
        });
        grid.innerHTML = html;

        let correct = 0, wrong = 0, unanswered = 0;
        allQuestions.forEach(q => {
            const a = answers[q.id];
            if (!a) unanswered++;
            else if (a === q.correctAnswer) correct++;
            else wrong++;
        });
        document.getElementById('navCorrect').textContent = correct;
        document.getElementById('navWrong').textContent = wrong;
        document.getElementById('navUnanswered').textContent = unanswered;
    }

    function goToQuestion(index) {
        const page = Math.floor(index / PER_PAGE);
        currentPage = page;
        render();
        renderNav();
        scrollToTop();
    }

    function render() {
        const container = document.getElementById('questionsContainer');
        const total = allQuestions.length;
        const totalPages = Math.ceil(total / PER_PAGE);
        const start = currentPage * PER_PAGE;
        const pageItems = allQuestions.slice(start, start + PER_PAGE);

        let correctCount = 0, answeredCount = 0;
        allQuestions.forEach(q => {
            if (answers[q.id]) {
                answeredCount++;
                if (answers[q.id] === q.correctAnswer) correctCount++;
            }
        });
        document.getElementById('totalStats').textContent = `${correctCount} / ${total}`;
        document.getElementById('totalCount').textContent = total;

        const progress = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
        document.getElementById('progressBar').style.width = progress + '%';

        document.getElementById('pageInfo').textContent = `Страница ${currentPage + 1} из ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;

        const allAnswered = allQuestions.every(q => answers[q.id] !== undefined);
        if (allAnswered && !testCompleted && allQuestions.length > 0) {
            testCompleted = true;
            showSummary(correctCount, total);
        }

        let html = '';
        pageItems.forEach((q) => {
            const userAnswer = answers[q.id] || null;
            const isCorrect = userAnswer && userAnswer === q.correctAnswer;
            const isWrong = userAnswer && userAnswer !== q.correctAnswer;
            let blockClass = 'question-block';
            if (userAnswer) {
                blockClass += isCorrect ? ' correct' : ' wrong';
            }

            html += `<div class="${blockClass}">`;
            html += `<div class="question-text"><span class="q-label">Билет ${q.ticket}</span> ${q.question}</div>`;
            html += `<div class="options">`;

            q.options.forEach(opt => {
                let optClass = 'option';
                let disabled = false;
                let checked = false;

                if (userAnswer) {
                    disabled = true;
                    if (opt === userAnswer && isCorrect) {
                        optClass += ' selected-correct';
                    } else if (opt === userAnswer && isWrong) {
                        optClass += ' selected-wrong';
                    } else if (opt === q.correctAnswer && isWrong) {
                        optClass += ' show-correct';
                    }
                    if (opt === userAnswer) checked = true;
                }

                if (disabled) optClass += ' disabled';

                html += `
                    <label class="${optClass}">
                        <input type="radio" name="q${q.id}" value="${opt.replace(/"/g, '&quot;')}"
                            ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}
                            onchange="selectAnswer(${q.id}, this.value)">
                        ${opt}
                    </label>
                `;
            });

            html += `</div>`;

            if (userAnswer) {
                const label = isCorrect ? '✅ Верно' : '❌ Неверно';
                const cls = isCorrect ? 'correct-text' : 'wrong-text';
                html += `<div class="result-badge"><span class="${cls}">${label}</span></div>`;
            }

            html += `</div>`;
        });

        if (pageItems.length === 0) {
            html = `<p style="text-align:center;color:#6a8aaa;">Нет вопросов на этой странице</p>`;
        }

        container.innerHTML = html;
        renderNav();
    }

    function showSummary(correct, total) {
        const container = document.getElementById('summaryContainer');
        const wrongQuestions = allQuestions.filter(q => answers[q.id] && answers[q.id] !== q.correctAnswer);
        const correctQuestions = allQuestions.filter(q => answers[q.id] && answers[q.id] === q.correctAnswer);

        let html = `
            <div class="summary">
                <h3>📊 Результаты теста</h3>
                <div class="summary-stats">
                    ✅ Правильно: ${correct} из ${total} (${Math.round((correct/total)*100)}%)
                </div>
                <div style="margin-bottom:12px;font-size:15px;">
                    ❌ Неправильно: ${wrongQuestions.length}
                </div>
                <div style="font-size:16px;font-weight:600;margin:10px 0 6px;color:#b33a2e;">
                    🔴 Вопросы, на которые дан неправильный ответ (${wrongQuestions.length}):
                </div>
        `;

        if (wrongQuestions.length === 0) {
            html += `<p style="color:#1a7a3a;font-weight:600;">🎉 Все ответы верные! Отлично!</p>`;
        } else {
            wrongQuestions.forEach(q => {
                html += `
                    <div class="summary-item">
                        <strong>${q.id}.</strong> [Билет ${q.ticket}] ${q.question}<br>
                        <span class="s-wrong">✗ Ваш ответ: ${answers[q.id]}</span><br>
                        <span class="s-correct">✓ Правильный ответ: ${q.correctAnswer}</span>
                    </div>
                `;
            });
        }

        if (correctQuestions.length > 0) {
            html += `<div style="font-size:16px;font-weight:600;margin:16px 0 6px;color:#1a7a3a;">✅ Правильные ответы (${correctQuestions.length}):</div>`;
            correctQuestions.forEach(q => {
                html += `
                    <div class="summary-item">
                        <strong>${q.id}.</strong> [Билет ${q.ticket}] ${q.question}<br>
                        <span class="s-correct">✓ Верно: ${q.correctAnswer}</span>
                    </div>
                `;
            });
        }

        html += `
                <button class="btn btn-primary hide-summary-btn" onclick="document.getElementById('summaryContainer').innerHTML='';">Скрыть сводку</button>
            </div>
        `;

        container.innerHTML = html;
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function selectAnswer(questionId, selectedText) {
        if (answers[questionId]) return;
        answers[questionId] = selectedText;
        render();
        renderNav();
    }

    // Навигация с прокруткой вверх
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 0) { currentPage--; render(); renderNav(); scrollToTop(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
        const totalPages = Math.ceil(allQuestions.length / PER_PAGE);
        if (currentPage < totalPages - 1) { currentPage++; render(); renderNav(); scrollToTop(); }
    });
    document.getElementById('restartBtn').addEventListener('click', init);

    init();
</script>
