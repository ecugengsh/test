<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тест по электробезопасности</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            display: flex;
            gap: 24px;
            max-width: 1300px;
            width: 100%;
            align-items: flex-start;
        }
        .container {
            flex: 1;
            min-width: 0;
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        .nav-panel {
            flex-shrink: 0;
            width: 240px;
            background: white;
            padding: 18px 16px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .nav-panel h3 {
            font-size: 15px;
            margin: 0 0 12px 0;
            color: #1a2a3a;
            text-align: center;
            border-bottom: 1px solid #e6edf5;
            padding-bottom: 10px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
        }
        .nav-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            background: #eef4fa;
            color: #1a2a3a;
            transition: 0.15s;
            border: 2px solid transparent;
            user-select: none;
        }
        .nav-cell:hover {
            background: #d0ddea;
            transform: scale(1.05);
        }
        .nav-cell.correct {
            background: #1e9b4c;
            color: white;
            border-color: #1a7a3a;
        }
        .nav-cell.wrong {
            background: #d43f34;
            color: white;
            border-color: #b33a2e;
        }
        .nav-cell.current {
            border-color: #1a6bc4;
            box-shadow: 0 0 0 2px #1a6bc4;
        }
        .nav-cell.unanswered {
            background: #eef4fa;
            color: #4a6a8a;
        }
        .nav-stats {
            margin-top: 12px;
            font-size: 13px;
            color: #2a4a6a;
            text-align: center;
            border-top: 1px solid #e6edf5;
            padding-top: 10px;
        }
        .nav-stats span {
            font-weight: 700;
        }
        .nav-stats .green { color: #1a7a3a; }
        .nav-stats .red { color: #b33a2e; }

        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #1a2a3a;
            border-bottom: 2px solid #e6edf5;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 16px;
            font-weight: normal;
            color: #4a6a8a;
        }
        .progress {
            background: #e6edf5;
            border-radius: 30px;
            height: 8px;
            margin: 10px 0 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #2a7de1;
            border-radius: 30px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .question-block {
            background: #f9fcff;
            border-radius: 14px;
            padding: 18px 20px 10px;
            margin-bottom: 20px;
            border: 1px solid #e2ebf5;
            transition: 0.2s;
        }
        .question-block.correct {
            border-left: 6px solid #1e9b4c;
            background: #f0faf4;
        }
        .question-block.wrong {
            border-left: 6px solid #d43f34;
            background: #fdf2f0;
        }
        .question-text {
            font-weight: 600;
            font-size: 16px;
            color: #0b1e2e;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 4px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: white;
            border: 1px solid #dce6f0;
            cursor: pointer;
            transition: 0.15s;
            font-size: 15px;
            line-height: 1.4;
        }
        .option:hover {
            background: #eef4fa;
            border-color: #b0c8df;
        }
        .option input[type="radio"] {
            margin-top: 4px;
            flex-shrink: 0;
            accent-color: #1a6bc4;
            width: 17px;
            height: 17px;
            cursor: pointer;
        }
        .option.selected-correct {
            background: #d4edda;
            border-color: #1e9b4c;
        }
        .option.selected-wrong {
            background: #f8ddda;
            border-color: #d43f34;
        }
        .option.show-correct {
            background: #d4edda;
            border-color: #1e9b4c;
        }
        .option.disabled {
            cursor: default;
            opacity: 0.9;
        }
        .option.disabled:hover {
            background: white;
        }
        .option.disabled.selected-correct:hover {
            background: #d4edda;
        }
        .option.disabled.selected-wrong:hover {
            background: #f8ddda;
        }
        .option.disabled.show-correct:hover {
            background: #d4edda;
        }
        .result-badge {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .result-badge .correct-text {
            color: #1a7a3a;
        }
        .result-badge .wrong-text {
            color: #b33a2e;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2ebf5;
        }
        .pagination .info {
            font-size: 15px;
            color: #2a4a6a;
        }
        .btn {
            background: #e6edf5;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            color: #1a2a3a;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover {
            background: #d0ddea;
        }
        .btn-primary {
            background: #1a6bc4;
            color: white;
        }
        .btn-primary:hover {
            background: #0f5aad;
        }
        .btn-secondary {
            background: #e6edf5;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn:disabled:hover {
            background: #e6edf5;
        }
        .restart-btn {
            background: #d43f34;
            color: white;
        }
        .restart-btn:hover {
            background: #b83228;
        }
        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #6a8aaa;
        }
        .summary {
            background: #f0f4fa;
            border-radius: 16px;
            padding: 20px 24px;
            margin-top: 10px;
            border: 2px solid #d0ddea;
        }
        .summary h3 {
            margin-top: 0;
            color: #1a2a3a;
        }
        .summary-item {
            padding: 6px 0;
            border-bottom: 1px solid #dce6f0;
            font-size: 14px;
            line-height: 1.5;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
        .summary-item .s-correct { color: #1a7a3a; font-weight: 600; }
        .summary-item .s-wrong { color: #b33a2e; font-weight: 600; }
        .summary-stats {
            font-size: 18px;
            font-weight: 700;
            padding: 12px 0 8px;
        }
        .hide-summary-btn {
            margin-top: 12px;
        }
        /* Анимация скролла */
        .scroll-anchor {
            scroll-margin-top: 20px;
        }

        @media (max-width: 960px) {
            .wrapper {
                flex-direction: column;
            }
            .nav-panel {
                width: 100%;
                position: static;
                max-height: none;
                order: -1;
            }
            .nav-grid {
                grid-template-columns: repeat(11, 1fr);
            }
        }
        @media (max-width: 600px) {
            .container { padding: 16px; }
            .question-text { font-size: 15px; }
            .option { font-size: 14px; padding: 6px 10px; }
            .pagination { flex-direction: column; align-items: stretch; }
            .pagination .info { text-align: center; }
            .btn { padding: 10px 16px; font-size: 14px; }
            .nav-panel { padding: 12px; }
            .nav-grid { grid-template-columns: repeat(9, 1fr); gap: 3px; }
            .nav-cell { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Основной контент -->
    <div class="container" id="app">
        <h1>
            <span>⚡ Тест по электробезопасности</span>
            <small id="totalStats">0 / 0</small>
        </h1>
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Якорь для прокрутки вверх -->
        <div class="scroll-anchor" id="scrollAnchor"></div>

        <div id="questionsContainer"></div>
        <div id="summaryContainer"></div>

        <div class="pagination" id="paginationControls">
            <span class="info" id="pageInfo">Страница 1 из 1</span>
            <div>
                <button class="btn btn-secondary" id="prevBtn" disabled>◀ Назад</button>
                <button class="btn btn-primary" id="nextBtn">Вперед ▶</button>
                <button class="btn restart-btn" id="restartBtn" style="margin-left:10px;">⟳ Заново</button>
            </div>
        </div>
        <div class="footer">
            Всего вопросов: <span id="totalCount">0</span>
        </div>
    </div>

    <!-- Навигационная таблица справа -->
    <div class="nav-panel" id="navPanel">
        <h3>📋 Навигация по вопросам</h3>
        <div class="nav-grid" id="navGrid"></div>
        <div class="nav-stats" id="navStats">
            ✅ <span class="green" id="navCorrect">0</span> &nbsp;|&nbsp; ❌ <span class="red" id="navWrong">0</span> &nbsp;|&nbsp; ⬜ <span id="navUnanswered">0</span>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. ВСЕ ВОПРОСЫ (полный список — 99 штук)
    // --------------------------------------------------------------
    const RAW_QUESTIONS = [
        // ---- 01_20.docx (1–20) ----
        { id: 1, question: "На кого распространяются Правила по охране труда при эксплуатации электроустановок, утвержденные приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "На работодателей - юридических и физических лиц независимо от их организационно-правовых форм и работников из числа электротехнического, электротехнологического и неэлектротехнического персонала", options: ["На работников промышленных предприятий, в составе которых имеются электроустановки", "На работников организаций независимо от форм собственности и организационно-правовых форм и других физических лиц, занятых техническим обслуживанием электроустановок, проводящих в них оперативные переключения, организующих и выполняющих испытания и измерения", "На работодателей - юридических и физических лиц независимо от их организационно-правовых форм и работников из числа электротехнического, электротехнологического и неэлектротехнического персонала", "На работников всех организаций независимо от формы собственности, занятых техническим обслуживанием электроустановок и выполняющих в них строительные, монтажные и ремонтные работы"] },
        { id: 2, question: "При каком условии работники, не обслуживающие электроустановки, могут допускаться для осмотра в распределительные устройства напряжением до 1000 В согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "В сопровождении оперативного персонала, обслуживающего данную электроустановку, имеющего группу III, либо работника, имеющего право единоличного осмотра", options: ["В сопровождении оперативного персонала, обслуживающего данную электроустановку, имеющего группу IV, либо работника, имеющего право единоличного осмотра", "В сопровождении оперативного персонала, обслуживающего данную электроустановку, имеющего группу III, либо работника, имеющего право единоличного осмотра", "В сопровождении опытного работника из числа ремонтного персонала, имеющего группу по электробезопасности не ниже V"] },
        { id: 3, question: "С какой целью допускается приближение на расстояние менее 8 метров к месту возникновения короткого замыкания на землю при работах на воздушной линии электропередачи согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Только для оперативных переключений с целью ликвидации замыкания и освобождения людей, попавших под напряжение", options: ["Только для оказания доврачебной помощи людям, попавшим под напряжение", "Только для определения визуального расстояния до опоры воздушной линии", "Только для оперативных переключений с целью ликвидации замыкания и освобождения людей, попавших под напряжение"] },
        { id: 4, question: "Кто дает разрешение на снятие напряжения при несчастных случаях для освобождения пострадавшего от действия электрического тока согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Предварительного разрешения оперативного персонала не требуется. Напряжение должно быть снято немедленно", options: ["Разрешение дает оперативный персонал энергообъекта", "Разрешение дает вышестоящий оперативный персонал", "Разрешение дает административно-технический персонал", "Предварительного разрешения оперативного персонала не требуется. Напряжение должно быть снято немедленно"] },
        { id: 5, question: "Какой порядок производства работ в действующих электроустановках является неверным согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Самовольно", options: ["По наряду-допуску", "По распоряжению", "На основании перечня работ, выполняемых в порядке текущей эксплуатации", "Самовольно"] },
        { id: 6, question: "Допускается ли самовольное проведение работ в действующих электроустановках, а также расширение рабочих мест и объема задания, определенных нарядом-допуском, распоряжением или утвержденным работодателем перечнем работ, выполняемых в порядке текущей эксплуатации, согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Самовольное проведение работ, расширение рабочих мест и объема задания, определенных нарядом-допуском, распоряжением или утвержденным работодателем перечнем работ, выполняемых в порядке текущей эксплуатации в действующих электроустановках не допускается", options: ["Допускается самовольное проведение работ только при возникновении аварийной ситуации с разрешения вышестоящего оперативного персонала", "Допускается расширение рабочих мест и объема задания, определенных нарядом-допуском или распоряжением при выполнении неотложных работ, для выполнения которых требуется более 1 часа, с разрешения производителя работ", "Допускается, учитывая важность электроустановки в технологическом процессе, с обязательной записью в оперативном журнале", "Самовольное проведение работ, расширение рабочих мест и объема задания, определенных нарядом-допуском, распоряжением или утвержденным работодателем перечнем работ, выполняемых в порядке текущей эксплуатации в действующих электроустановках не допускается"] },
        { id: 7, question: "Допустимо ли пребывание одного или нескольких членов бригады отдельно от производителя работ в случае рассредоточения членов бригады по разным рабочим местам согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Допустимо, при наличии у членов бригады III группы по электробезопасности", options: ["Недопустимо в любом случае", "Допустимо в любом случае", "Допустимо, при наличии у членов бригады III группы по электробезопасности", "Допустимо, при проведении соответствующего инструктажа"] },
        { id: 8, question: "В каких электроустановках могут выполняться работы в порядке текущей эксплуатации согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "В электроустановках напряжением до 1000 В", options: ["В электроустановках напряжением до 1000 В", "В электроустановках напряжением выше 1000 В", "В любых электроустановках", "Только в электроустановках напряжением не выше 380 В"] },
        { id: 9, question: "Какие работы можно отнести к работам, выполняемым в порядке текущей эксплуатации, в электроустановках напряжением до 1000 В, согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Снятие и установка электросчетчиков, других приборов и средств измерений", options: ["Снятие и установка электросчетчиков, других приборов и средств измерений", "Ремонт пусковой и коммутационной аппаратуры, установленной на щитках", "Замена ламп и чистка светильников на высоте более 2,5 м", "Любые из перечисленных работ"] },
        { id: 10, question: "Какие мероприятия необходимо учитывать при оформлении перечня работ, выполняемых в порядке текущей эксплуатации, согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Необходимо учитывать все перечисленные мероприятия", options: ["Только условия безопасности и возможности единоличного выполнения конкретных работ", "Только квалификацию персонала", "Только степень важности электроустановки в целом или ее отдельных элементов в технологическом процессе", "Необходимо учитывать все перечисленные мероприятия"] },
        { id: 11, question: "Какой инструктаж должен пройти электротехнический персонал перед началом работ по распоряжению согласно Правилам по охране труда при эксплуатации электроустановок, утвержденным приказом Минтруда России от 15.12.2020 г. № 903н?", correctAnswer: "Целевой", options: ["Первичный на рабочем месте", "Вводный", "Целевой", "Повторный"] },

    // --------------------------------------------------------------
    // 2. Перемешивание
    // --------------------------------------------------------------
    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // --------------------------------------------------------------
    // 3. Состояние
    // --------------------------------------------------------------
    let allQuestions = [];
    let currentPage = 0;
    const PER_PAGE = 3;
    let answers = {};
    let testCompleted = false;

    // --------------------------------------------------------------
    // 4. Функция прокрутки вверх
    // --------------------------------------------------------------
    function scrollToTop() {
        const anchor = document.getElementById('scrollAnchor');
        if (anchor) {
            anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // --------------------------------------------------------------
    // 5. Инициализация
    // --------------------------------------------------------------
    function init() {
        const shuffled = shuffleArray(RAW_QUESTIONS);
        allQuestions = shuffled.map(q => ({
            ...q,
            options: shuffleArray(q.options)
        }));
        currentPage = 0;
        answers = {};
        testCompleted = false;
        document.getElementById('summaryContainer').innerHTML = '';
        render();
        renderNav();
        scrollToTop();
    }

    // --------------------------------------------------------------
    // 6. Рендеринг навигационной таблицы
    // --------------------------------------------------------------
    function renderNav() {
        const grid = document.getElementById('navGrid');
        const total = allQuestions.length;
        let html = '';
        allQuestions.forEach((q, idx) => {
            const userAnswer = answers[q.id];
            let cls = 'nav-cell unanswered';
            if (userAnswer) {
                cls = userAnswer === q.correctAnswer ? 'nav-cell correct' : 'nav-cell wrong';
            }
            const start = currentPage * PER_PAGE;
            if (idx >= start && idx < start + PER_PAGE) {
                cls += ' current';
            }
            html += `<div class="${cls}" onclick="goToQuestion(${idx})" title="Вопрос ${q.id}">${q.id}</div>`;
        });
        grid.innerHTML = html;

        let correct = 0, wrong = 0, unanswered = 0;
        allQuestions.forEach(q => {
            const a = answers[q.id];
            if (!a) unanswered++;
            else if (a === q.correctAnswer) correct++;
            else wrong++;
        });
        document.getElementById('navCorrect').textContent = correct;
        document.getElementById('navWrong').textContent = wrong;
        document.getElementById('navUnanswered').textContent = unanswered;
    }

    // --------------------------------------------------------------
    // 7. Переход к вопросу
    // --------------------------------------------------------------
    function goToQuestion(index) {
        const page = Math.floor(index / PER_PAGE);
        currentPage = page;
        render();
        renderNav();
        scrollToTop();
    }

    // --------------------------------------------------------------
    // 8. Рендеринг вопросов
    // --------------------------------------------------------------
    function render() {
        const container = document.getElementById('questionsContainer');
        const total = allQuestions.length;
        const totalPages = Math.ceil(total / PER_PAGE);
        const start = currentPage * PER_PAGE;
        const pageItems = allQuestions.slice(start, start + PER_PAGE);

        let correctCount = 0;
        let answeredCount = 0;
        allQuestions.forEach(q => {
            if (answers[q.id]) {
                answeredCount++;
                if (answers[q.id] === q.correctAnswer) correctCount++;
            }
        });
        document.getElementById('totalStats').textContent = `${correctCount} / ${total}`;
        document.getElementById('totalCount').textContent = total;

        const progress = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
        document.getElementById('progressBar').style.width = progress + '%';

        document.getElementById('pageInfo').textContent = `Страница ${currentPage + 1} из ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;

        const allAnswered = allQuestions.every(q => answers[q.id] !== undefined);
        if (allAnswered && !testCompleted && allQuestions.length > 0) {
            testCompleted = true;
            showSummary(correctCount, total);
        }

        let html = '';
        pageItems.forEach((q, idx) => {
            const userAnswer = answers[q.id] || null;
            const isCorrect = userAnswer && userAnswer === q.correctAnswer;
            const isWrong = userAnswer && userAnswer !== q.correctAnswer;
            let blockClass = 'question-block';
            if (userAnswer) {
                blockClass += isCorrect ? ' correct' : ' wrong';
            }

            html += `<div class="${blockClass}">`;
            html += `<div class="question-text">${q.id}. ${q.question}</div>`;
            html += `<div class="options">`;

            q.options.forEach(opt => {
                let optClass = 'option';
                let disabled = false;
                let checked = false;

                if (userAnswer) {
                    disabled = true;
                    if (opt === userAnswer && isCorrect) {
                        optClass += ' selected-correct';
                    } else if (opt === userAnswer && isWrong) {
                        optClass += ' selected-wrong';
                    } else if (opt === q.correctAnswer && isWrong) {
                        optClass += ' show-correct';
                    }
                    if (opt === userAnswer) checked = true;
                }

                if (disabled) optClass += ' disabled';

                html += `
                    <label class="${optClass}">
                        <input type="radio" name="q${q.id}" value="${opt.replace(/"/g, '&quot;')}"
                            ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}
                            onchange="selectAnswer(${q.id}, this.value)">
                        ${opt}
                    </label>
                `;
            });

            html += `</div>`;

            if (userAnswer) {
                const label = isCorrect ? '✅ Верно' : '❌ Неверно';
                const cls = isCorrect ? 'correct-text' : 'wrong-text';
                html += `<div class="result-badge"><span class="${cls}">${label}</span></div>`;
            }

            html += `</div>`;
        });

        if (pageItems.length === 0) {
            html = `<p style="text-align:center;color:#6a8aaa;">Нет вопросов на этой странице</p>`;
        }

        container.innerHTML = html;
        renderNav();
    }

    // --------------------------------------------------------------
    // 9. Сводка
    // --------------------------------------------------------------
    function showSummary(correct, total) {
        const container = document.getElementById('summaryContainer');
        const wrongQuestions = allQuestions.filter(q => answers[q.id] && answers[q.id] !== q.correctAnswer);
        const correctQuestions = allQuestions.filter(q => answers[q.id] && answers[q.id] === q.correctAnswer);

        let html = `
            <div class="summary">
                <h3>📊 Результаты теста</h3>
                <div class="summary-stats">
                    ✅ Правильно: ${correct} из ${total} (${Math.round((correct/total)*100)}%)
                </div>
                <div style="margin-bottom:12px;font-size:15px;">
                    ❌ Неправильно: ${wrongQuestions.length}
                </div>
                <div style="font-size:16px;font-weight:600;margin:10px 0 6px;color:#b33a2e;">
                    🔴 Вопросы, на которые дан неправильный ответ (${wrongQuestions.length}):
                </div>
        `;

        if (wrongQuestions.length === 0) {
            html += `<p style="color:#1a7a3a;font-weight:600;">🎉 Все ответы верные! Отлично!</p>`;
        } else {
            wrongQuestions.forEach(q => {
                html += `
                    <div class="summary-item">
                        <strong>${q.id}.</strong> ${q.question}<br>
                        <span class="s-wrong">✗ Ваш ответ: ${answers[q.id]}</span><br>
                        <span class="s-correct">✓ Правильный ответ: ${q.correctAnswer}</span>
                    </div>
                `;
            });
        }

        if (correctQuestions.length > 0) {
            html += `<div style="font-size:16px;font-weight:600;margin:16px 0 6px;color:#1a7a3a;">✅ Правильные ответы (${correctQuestions.length}):</div>`;
            correctQuestions.forEach(q => {
                html += `
                    <div class="summary-item">
                        <strong>${q.id}.</strong> ${q.question}<br>
                        <span class="s-correct">✓ Верно: ${q.correctAnswer}</span>
                    </div>
                `;
            });
        }

        html += `
                <button class="btn btn-primary hide-summary-btn" onclick="document.getElementById('summaryContainer').innerHTML='';">Скрыть сводку</button>
            </div>
        `;

        container.innerHTML = html;
        setTimeout(() => container.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    }

    // --------------------------------------------------------------
    // 10. Выбор ответа
    // --------------------------------------------------------------
    function selectAnswer(questionId, selectedText) {
        if (answers[questionId]) return;
        answers[questionId] = selectedText;
        render();
        renderNav();
    }

    // --------------------------------------------------------------
    // 11. Навигация с прокруткой вверх
    // --------------------------------------------------------------
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 0) { currentPage--; render(); renderNav(); scrollToTop(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
        const totalPages = Math.ceil(allQuestions.length / PER_PAGE);
        if (currentPage < totalPages - 1) { currentPage++; render(); renderNav(); scrollToTop(); }
    });
    document.getElementById('restartBtn').addEventListener('click', init);

    // --------------------------------------------------------------
    // 12. Запуск
    // --------------------------------------------------------------
    init();
</script>
</body>
</html>
